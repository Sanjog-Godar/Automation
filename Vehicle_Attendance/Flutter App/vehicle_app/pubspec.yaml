name: vehicle_app
description: "Vehicle Attendance & Earnings Tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.6
  go_router: ^18.1.3
  nepali_utils: ^3.0.8
  pdf: ^3.13.1
  printing: ^5.15.1
  intl: ^0.20.3
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
